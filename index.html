<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2.5D Dual Racer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #4CAF50; overflow: hidden; }
    canvas { display: block; margin: auto; background: #4CAF50; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 400;
canvas.height = 600;

let trackSpeed = 4;
let finishLineY = -2000;
let gameOver = false;
let winner = "";

const carImg1 = new Image();
const carImg2 = new Image();
carImg1.src = "https://i.imgur.com/8QfZmrG.png"; // Red car
carImg2.src = "https://i.imgur.com/1nQU0Yt.png"; // Orange car

const player1 = {
  x: 100,
  y: 500,
  w: 50,
  h: 100,
  color: "red",
  img: carImg1,
  up: "w",
  down: "s",
  left: "a",
  right: "d",
  vy: 0,
};

const player2 = {
  x: 250,
  y: 500,
  w: 50,
  h: 100,
  color: "orange",
  img: carImg2,
  up: "ArrowUp",
  down: "ArrowDown",
  left: "ArrowLeft",
  right: "ArrowRight",
  vy: 0,
};

const keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function drawTrack() {
  ctx.fillStyle = "#333";
  ctx.fillRect(75, 0, 250, canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(150, y);
    ctx.lineTo(150, y + 20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(250, y);
    ctx.lineTo(250, y + 20);
    ctx.stroke();
  }

  // Finish Line
  if (finishLineY < canvas.height) {
    ctx.fillStyle = "white";
    for (let i = 75; i < 325; i += 20) {
      ctx.fillRect(i, finishLineY, 10, 10);
    }
  }
}

function movePlayer(p) {
  if (keys[p.up]) p.y -= 5;
  if (keys[p.down]) p.y += 5;
  if (keys[p.left]) p.x -= 5;
  if (keys[p.right]) p.x += 5;

  // keep on road
  p.x = Math.max(80, Math.min(270, p.x));
}

function drawPlayer(p) {
  ctx.drawImage(p.img, p.x, p.y, p.w, p.h);
}

function checkWinner(p, name) {
  if (p.y <= finishLineY + 50 && !gameOver) {
    gameOver = true;
    winner = `${name.toUpperCase()} WINS!`;
  }
}

function update() {
  if (gameOver) {
    ctx.fillStyle = "black";
    ctx.font = "40px sans-serif";
    ctx.fillText(winner, 80, 300);
    ctx.font = "20px sans-serif";
    ctx.fillText("Refresh to play again", 110, 340);
    return;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTrack();
  movePlayer(player1);
  movePlayer(player2);
  drawPlayer(player1);
  drawPlayer(player2);

  finishLineY += trackSpeed;
  checkWinner(player1, "Red Car");
  checkWinner(player2, "Orange Car");

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
